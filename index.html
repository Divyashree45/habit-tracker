<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Habit Tracker</h1>
        <p>Transform your life with small, consistent action every day</p>
    </header>

    <main>

        <section>
            <h2>Add a New Habit</h2>

            <form id="habitForm">

                <div class="form-group">
                    <label for="habitName">Habit Name:</label>
                    <input
                        type="text"
                        id="habitName"
                        placeholder="Enter your habit"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="habitFrequency">Frequency:</label>
                    <select id="habitFrequency" required>
                        <option value="">Select frequency</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                    </select>
                </div>

                <button type="submit">Add Habit</button>

            </form>
        </section>

        <section>

            <h2>My Habits</h2>

            <input
                type="text"
                class="search-box"
                placeholder="Search habits..."
            >

            <div class="filters">
                <button>All</button>
                <button>Daily</button>
                <button>Weekly</button>
            </div>

            <div class="progress-summary">

                <h3>Weekly Progress</h3>

                <p id="weeklyProgressText">
                    0 of 0 habits completed
                </p>

                <div class="overall-progress">
                    <div
                        class="overall-progress-bar"
                        id="overallProgressBar"
                    ></div>
                </div>

            </div>

            <div id="habitList"></div>

            <p class="empty-message">
                No habits found. Add a new habit to get started!
            </p>

        </section>

    </main>

    <footer>
        <p>Habit Tracker © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
